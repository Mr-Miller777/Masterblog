<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    <a href="{{ url_for('add') }}">Neuen Beitrag hinzufügen</a>
    <hr>
    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p><em>von {{ post.author }}</em></p>
            <p>{{ post.content }}</p>
            <!-- Delete button as a GET link, with a confirmation dialog -->
            <a href="{{ url_for('delete', post_id=post.id) }}"
               onclick="return confirm('Möchtest du diesen Beitrag wirklich löschen?');">
               Löschen
            </a>
        </div>
        <hr>
    {% else %}
        <p>Noch keine Beiträge vorhanden.</p>
    {% endfor %}
</body>
</html>
